<style>
/* Layout: app shell — sticky top bar, one panel per tab, bottom tab bar on phones. Court-green surfaces, line-white rules, shuttle-orange for actions. */
:root{
  --bg:#eef3f0; --surface:#ffffff; --surface2:#e3ebe6; --fg:#14231c; --muted:#5b6d64; --line:#cfdcd4;
  --court:#1d6b52; --court-ink:#ffffff; --accent:#e8622c; --accent-ink:#ffffff;
  --good:#1f8a4c; --bad:#c43d32; --warn:#b7791f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#17221d; --surface2:#1f2d27; --fg:#e4eee8; --muted:#93a69c; --line:#2c3d35;
  --court:#2f8f6f; --court-ink:#ffffff; --accent:#f27a45; --accent-ink:#1a0d06;
  --good:#4cc07c; --bad:#ef6b5f; --warn:#e0a84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#17221d; --surface2:#1f2d27; --fg:#e4eee8; --muted:#93a69c; --line:#2c3d35;
  --court:#2f8f6f; --court-ink:#ffffff; --accent:#f27a45; --accent-ink:#1a0d06;
  --good:#4cc07c; --bad:#ef6b5f; --warn:#e0a84a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:var(--court-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.08em;opacity:.8;text-transform:uppercase;margin-top:2px}
.sync{margin-left:auto;white-space:nowrap;font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#ffd36b;display:inline-block}
.sync.ok i{background:#7df0b0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 2px 8px;color:var(--muted);font:600 12px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--court)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-size:30px;text-transform:uppercase;letter-spacing:.02em;margin:4px 0 4px;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px;font-weight:700}
.lead{color:var(--muted);margin:0 0 14px;max-width:65ch}
.panel{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f,div.f{display:grid;justify-items:start;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--court)}
.btn{font:600 14px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.court{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font:600 13px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--court);color:var(--court-ink)}
.num{font-variant-numeric:tabular-nums}

.pill{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);letter-spacing:.02em}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

/* players */
.plist{display:grid;gap:0}
.prow{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.prow select{width:auto;padding:5px 6px}
/* court */
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.court{background:var(--court);color:var(--court-ink);border-radius:10px;padding:12px;position:relative;overflow:hidden}
.court::before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.45);border-radius:4px;pointer-events:none}
.court .cname{position:relative;font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;text-align:center;margin:4px 0 8px}
.court .sides::after{content:"";position:absolute;left:50%;top:-4px;bottom:0;border-left:2px dashed rgba(255,255,255,.55)}
.court .sides{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:4px 12px 8px}
.court .side{display:grid;gap:4px;text-align:center;min-width:0}
.court .side b{font-weight:600;overflow-wrap:anywhere}
.court .side .sum{font-size:11px;opacity:.8}
.court .score{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:6px 12px 6px}
.court .score input{text-align:center;background:rgba(255,255,255,.95);color:#14231c;border:0;font-weight:700;font-size:18px;padding:6px}
.court .score span{font-family:var(--display);font-size:20px}
.court .act{position:relative;display:flex;justify-content:center;gap:8px;padding:4px 12px 6px}
.court .act .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.court .act .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:13px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.chip .lv{color:inherit;opacity:.85}
/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:8px;padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat .v{font-family:var(--display);font-size:28px;line-height:1.1}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.list-entry{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.list-entry:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:90vw}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
textarea{font:13px/1.5 ui-monospace,Menlo,monospace;width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface2);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:900px){nav.tabs{top:auto}}
tr.win td{background:color-mix(in srgb,var(--good) 10%,transparent)}
tr.lose td{background:color-mix(in srgb,var(--bad) 9%,transparent)}
.medal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface2);font:700 13px var(--display)}
tr.win .medal{background:var(--good);color:#fff}
tr.lose .medal{background:var(--bad);color:#fff}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{border:0;background:var(--surface2);width:34px;height:36px;font:700 18px var(--body);color:var(--fg);cursor:pointer}
.step output{min-width:36px;text-align:center;font:700 16px var(--body)}
.gx{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.gx.nu{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.court .gx{background:rgba(255,255,255,.2);color:#fff}
.court .warn{position:relative;text-align:center;font-size:12px;background:rgba(0,0,0,.25);border-radius:6px;margin:0 12px 6px;padding:4px 8px}
.court .warn.tired{background:rgba(232,98,44,.55)}
.court.free{display:grid;place-items:center;gap:8px;min-height:180px;text-align:center}
.court.free p{position:relative;margin:0;opacity:.9}
.court.free .act{flex-wrap:wrap}
.chip .rest{font-size:11px;font-weight:700;opacity:.85}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,20,15,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .box{background:var(--surface);color:var(--fg);border-radius:12px;max-width:420px;width:100%;padding:14px;display:grid;gap:10px}
.sheet img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.kv b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sig{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.02em;padding-block:8px 24px}
.sig b{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--court)}
.note{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px}
</style>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const money=n=>(Math.round(+n||0)).toLocaleString("vi-VN")+"đ";
const fmtDate=s=>{if(!s)return"";const [y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.-]/g,""));return isFinite(n)?n:0};
const ceil1k=n=>Math.ceil(n/1000)*1000;
const IN_CLAUDE=!!(window.claude&&window.claude.use);
function plainDownload(filename,data,type){try{const blob=data instanceof Blob?data:new Blob([data],{type:type||"application/octet-stream"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}catch(e){return false}}
let toastT;function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* ---------- store: shared db when available, else this browser ---------- */
const COLS=["players","matches","sessions"];
const ITEMS=[["court","Tiền sân"],["shuttle","Tiền cầu"],["drink","Tiền nước"],["other","Chi khác"]];
const DEFAULT_CFG={genderBalance:true,courts:2,winPts:3,losePts:0,topN:1,bottomM:1,exempt:{court:true,shuttle:false,drink:true,other:false},courtFee:200000,shuttlePrice:25000,bank:{bin:"970418",acct:"6800981962",holder:"NGUYEN MINH DUY"}};
const S={players:{},matches:{},sessions:{},cfg:null};
let db=null,mode="local",canWrite=true;
const LS="caulong.v2";
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);COLS.forEach(c=>S[c]=o[c]||{});S.cfg=o.cfg||null}}catch(e){}}
function saveLocal(){if(mode!=="local")return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function cfg(){const c=Object.assign({},DEFAULT_CFG,S.cfg||{});c.exempt=Object.assign({},DEFAULT_CFG.exempt,c.exempt||{});return c}
function fail(e){console.error(e);if(e&&e.code==="invalid_argument"){canWrite=false;toast("Bạn chỉ có quyền xem, không lưu được");render()}else toast("Không lưu được, thử lại sau")}
function put(col,id,data){S[col][id]=data;render();if(db)db.collection(col).doc(id).set(data).catch(fail);else saveLocal()}
function del(col,id){delete S[col][id];render();if(db)db.collection(col).doc(id).delete().catch(fail);else saveLocal()}
function upd(col,id,patch){const cur=S[col][id];if(!cur)return;put(col,id,Object.assign({},cur,patch))}
function putCfg(patch){S.cfg=Object.assign({},cfg(),patch);render();if(db)db.doc("config/main").set(S.cfg).catch(fail);else saveLocal()}
function setSync(ok,text){const el=$("#sync");el.className="sync"+(ok?" ok":"");el.lastElementChild.textContent=text}
async function initStore(){
  let d=null;
  try{d=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){d=null}
  if(!d){mode="local";loadLocal();setSync(false,"Lưu trên máy này");render();return}
  db=d;mode="db";setSync(false,"Đang tải…");
  const pending=new Set(COLS.concat("cfg"));
  const timer=setTimeout(()=>{if(pending.size)setSync(false,"Chưa tải được dữ liệu chung")},10000);
  const done=k=>{pending.delete(k);if(!pending.size){clearTimeout(timer);setSync(true,"Đồng bộ cả nhóm")}};
  COLS.forEach(c=>{db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(doc=>{o[doc.id]=doc.data()});S[c]=o;if(!snap.metadata.fromCache)done(c);render()},err=>{console.error(err);done(c);setSync(false,"Lỗi đồng bộ")})});
  db.doc("config/main").onSnapshot(snap=>{S.cfg=snap.exists?snap.data():null;if(!snap.metadata.fromCache)done("cfg");render()},()=>done("cfg"));
  try{const u=await window.claude.use("user");if(u){const w=await u.can("data.write");if(w===false){canWrite=false;render()}}}catch(e){}
}

/* ---------- derived ---------- */
const players=()=>Object.entries(S.players).map(([id,p])=>Object.assign({id},p)).sort((a,b)=>a.name.localeCompare(b.name,"vi"));
const pname=id=>(S.players[id]&&S.players[id].name)||"(đã xoá)";
const plevel=id=>(S.players[id]&&+S.players[id].level)||3;
const isNu=id=>!!(S.players[id]&&S.players[id].g==="nu");
const gTag=id=>isNu(id)?'<span class="gx nu">Nữ</span>':'<span class="gx">Nam</span>';
const matchesList=()=>Object.entries(S.matches).map(([id,m])=>Object.assign({id},m)).sort((a,b)=>(b.at||0)-(a.at||0));
const matchesOn=date=>matchesList().filter(m=>m.date===date);
function gamesOn(id,date){return matchesOn(date).filter(m=>m.a.concat(m.b).includes(id)).length}
function partnerCount(x,y,date){let n=0;matchesOn(date).forEach(m=>[m.a,m.b].forEach(t=>{if(t.includes(x)&&t.includes(y))n++}));return n}
/* "just played": no other match has started since this person's last match ended, so they have not rested a turn yet */
function lastEnd(id,date){let t=0;matchesOn(date).forEach(m=>{if(m.a.concat(m.b).includes(id))t=Math.max(t,m.at||0)});return t}
function justPlayed(id,date){
  const end=lastEnd(id,date);if(!end)return false;
  const without=m=>!m.a.concat(m.b).includes(id);
  if(matchesOn(date).some(m=>(m.startAt||m.at)>end&&without(m)))return false;
  if(ui.draft&&ui.draft.courts.some(m=>!m.free&&m.startAt>end&&without(m)))return false;
  return true;
}
const sessionsList=()=>Object.entries(S.sessions).map(([id,s])=>Object.assign({id},s)).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.at||0)-(a.at||0));
const sessionOn=date=>sessionsList().find(s=>s.date===date);
/* rules for a date: the session's own settings if a session exists, else group defaults */
function rulesFor(date){const c=cfg();const s=sessionOn(date);const r={winPts:c.winPts,losePts:c.losePts,topN:c.topN,bottomM:c.bottomM,exempt:c.exempt};if(s){["topN","bottomM"].forEach(k=>{if(s[k]!=null)r[k]=+s[k]});if(s.exempt)r.exempt=Object.assign({},c.exempt,s.exempt)}return r}
/* individual standings for one day: points, then point difference, then fewer games */
function standings(date,onlyIds){
  const r=rulesFor(date);const st={};
  const ensure=id=>st[id]||(st[id]={id,w:0,l:0,pf:0,pa:0});
  (onlyIds||[]).forEach(ensure);
  matchesOn(date).forEach(m=>{const aw=+m.sa>+m.sb;
    m.a.forEach(id=>{if(onlyIds&&!onlyIds.includes(id))return;const x=ensure(id);x.pf+=+m.sa;x.pa+=+m.sb;aw?x.w++:x.l++});
    m.b.forEach(id=>{if(onlyIds&&!onlyIds.includes(id))return;const x=ensure(id);x.pf+=+m.sb;x.pa+=+m.sa;aw?x.l++:x.w++})});
  const rows=Object.values(st).map(x=>Object.assign(x,{g:x.w+x.l,pts:x.w*r.winPts+x.l*r.losePts,diff:x.pf-x.pa}));
  rows.sort((a,b)=>b.pts-a.pts||b.diff-a.diff||a.g-b.g||pname(a.id).localeCompare(pname(b.id),"vi"));
  const n=rows.length;const topN=Math.min(r.topN,n);const bottomM=Math.min(r.bottomM,Math.max(0,n-topN));
  rows.forEach((x,i)=>{x.rank=i+1;x.role=i<topN?"win":(i>=n-bottomM?"lose":"")});
  const same=(a,b)=>a&&b&&a.pts===b.pts&&a.diff===b.diff;
  const tieTop=topN>0&&topN<n&&same(rows[topN-1],rows[topN]);
  const tieBot=bottomM>0&&n-bottomM-1>=0&&same(rows[n-bottomM],rows[n-bottomM-1]);
  return {rows,rules:r,tie:tieTop||tieBot,played:matchesOn(date).length};
}

/* ---------- pairing: random teams, balanced by level ---------- */
let ui={tab:"ghep",pmode:"trinhdo",fmt:"doi",draft:null,confirm:null,sessionId:null,day:null};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const REST=1200,EXTRA_GAME=300;
function pairCourts(pool,nCourts){
  const c=cfg();const t=today();const per=ui.fmt==="doi"?4:2;
  const courts=Math.min(nCourts,Math.floor(pool.length/per));if(courts<1)return null;
  const need=courts*per;
  const pri={},tired={};pool.forEach(id=>{tired[id]=justPlayed(id,t);pri[id]=(tired[id]?REST:0)+gamesOn(id,t)*EXTRA_GAME});
  const pc={};matchesOn(t).forEach(m=>[m.a,m.b].forEach(tm=>{if(tm.length===2){const k=tm.slice().sort().join("|");pc[k]=(pc[k]||0)+1}}));
  const partners=(x,y)=>pc[[x,y].sort().join("|")]||0;
  const byLevel=ui.pmode==="trinhdo";const byGender=!!c.genderBalance;const GENDER=c.priority==="gender"?2500:1000;
  let best=null,bestScore=Infinity;
  for(let k=0;k<1500;k++){
    /* rested people and those with fewer games go first; sometimes try a swap with someone waiting */
    let playing=shuffle(pool).sort((x,y)=>pri[x]-pri[y]).slice(0,need);
    if(k%2===1&&pool.length>need){const wait=pool.filter(id=>!playing.includes(id));const o=playing[Math.floor(Math.random()*need)],n=wait[Math.floor(Math.random()*wait.length)];playing=playing.map(id=>id===o?n:id)}
    let score=playing.reduce((a,id)=>a+pri[id],0);
    const ids=shuffle(playing);const out=[];
    for(let i=0;i<courts;i++){
      const g=ids.slice(i*per,i*per+per);const A=g.slice(0,per/2),B=g.slice(per/2);
      const sa=A.reduce((x,id)=>x+plevel(id),0),sb=B.reduce((x,id)=>x+plevel(id),0);
      const fa=A.filter(isNu).length,fb=B.filter(isNu).length;
      if(byGender)score+=Math.abs(fa-fb)*GENDER;
      if(byLevel)score+=Math.abs(sa-sb)*10;
      if(per===4)score+=(partners(A[0],A[1])+partners(B[0],B[1]))*4;
      out.push({a:A,b:B,sa:"",sb:"",warn:byGender&&fa!==fb,tired:g.filter(id=>tired[id])});
    }
    score+=Math.random()*3; /* keep it random among equally fair options */
    if(score<bestScore){bestScore=score;best=out}
  }
  const now=Date.now();best.forEach(m=>m.startAt=now);
  return best;
}
const hereIds=()=>players().filter(p=>p.here).map(p=>p.id);
const onCourt=(skip)=>new Set((ui.draft?ui.draft.courts:[]).filter((m,i)=>!m.free&&i!==skip).flatMap(m=>m.a.concat(m.b)));
function pairAll(){const per=ui.fmt==="doi"?4:2;const pool=hereIds();const res=pairCourts(pool,Math.max(1,+cfg().courts||1));
  ui.draft=res?{courts:res}:{courts:[],err:"Cần ít nhất "+per+" người đã điểm danh."}}
function pairOne(i){const busy=onCourt(i);const pool=hereIds().filter(id=>!busy.has(id));const res=pairCourts(pool,1);
  if(!res){toast("Không đủ người đang chờ để bốc trận cho sân này");return}ui.draft.courts[i]=res[0]}

/* ---------- money: winners skip chosen items, losers cover them ---------- */
function sessionCalc(s){
  const items={court:num(s.courtFee),shuttle:num(s.shuttles)*num(s.shuttlePrice),drink:num(s.drink),other:num(s.other)};
  const total=items.court+items.shuttle+items.drink+items.other;
  const att=(s.att||[]).filter(id=>S.players[id]);const n=att.length;
  const sd=standings(s.date,att);const r=sd.rules;
  const base=n?total/n:0;
  const exemptTotal=ITEMS.reduce((a,[k])=>a+(r.exempt[k]?items[k]:0),0);
  const exemptEach=n?exemptTotal/n:0;
  const winners=sd.played?sd.rows.filter(x=>x.role==="win").map(x=>x.id):[];
  const losers=sd.played?sd.rows.filter(x=>x.role==="lose").map(x=>x.id):[];
  const extra=losers.length?exemptEach*winners.length/losers.length:0;
  const pay={};att.forEach(id=>{let v=base;if(winners.includes(id))v-=exemptEach;if(losers.includes(id))v+=extra;pay[id]=ceil1k(Math.max(0,v))});
  if(!losers.length)winners.forEach(id=>pay[id]=ceil1k(base)); /* nobody to cover: no exemption */
  const collected=Object.values(pay).reduce((a,b)=>a+b,0);
  return {items,total,n,base,exemptEach,extra,winners,losers,pay,collected,sd};
}

function vietqr(bin,acct,amount,content){

  return `<section class="panel"><div><h2>Lịch sử</h2><p class="lead">Tổng hợp mọi buổi: số lần được miễn tiền, số lần chịu tiền, và tỉ lệ thắng.</p></div>
  ${ps.length?`<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Tên</th><th class="r">Lần được miễn</th><th class="r">Lần chịu tiền</th><th class="r">Trận</th><th class="r">Tỉ lệ thắng</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.p.name)} <span class="lv">T${+r.p.level||3}</span></td><td class="r num">${r.top}</td><td class="r num">${r.bot}</td><td class="r num">${r.g}</td><td class="r num">${r.g?Math.round(r.rate*100)+"%":"—"}</td></tr>`).join("")}
  </tbody></table></div></div>`:emptyPlayers()}
  <div class="card"><h3>Tất cả các trận <span class="pill num">${M.length}</span></h3>${M.length?M.slice(0,80).map(matchLine).join(""):`<p class="muted small" style="margin:0">Chưa có trận nào.</p>`}</div></section>`;
}

/* ---------- actions ---------- */
function setRule(key,val){
  const date=ui.tab==="tien"&&ui.sessionId?S.sessions[ui.sessionId].date:(ui.day||today());
  const s=ui.tab==="tien"&&ui.sessionId?Object.assign({id:ui.sessionId},S.sessions[ui.sessionId]):sessionOn(date);
  putCfg({[key]:val});
  if(s)upd("sessions",s.id,{[key]:val});
}
function newSession(date){const c=cfg();const ex=sessionOn(date);if(ex){ui.sessionId=ex.id;ui.tab="tien";render();return}
  const played=[...new Set(matchesOn(date).flatMap(m=>m.a.concat(m.b)))];
  const att=[...new Set(played.concat(date===today()?players().filter(p=>p.here).map(p=>p.id):[]))];
  const sid=uid();ui.sessionId=sid;ui.tab="tien";
  put("sessions",sid,{date,courtFee:+c.courtFee,shuttles:0,shuttlePrice:+c.shuttlePrice,drink:0,other:0,att,paid:{},topN:c.topN,bottomM:c.bottomM,exempt:c.exempt,at:Date.now()})}
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){ui.receipt=null;render();return}
  const t=e.target.closest("[data-act]");if(!t||t.closest("#tabs"))return;
  if(t.tagName==="INPUT"||t.tagName==="SELECT")return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case "goto":ui.tab=t.dataset.tab;if(ui.tab==="diem")ui.day=today();render();window.scrollTo(0,0);break;
    case "gotosess":ui.sessionId=id;ui.tab="tien";render();window.scrollTo(0,0);break;
    case "sample":[["Tuấn",5,"nam"],["Hùng",4,"nam"],["Lan",3,"nu"],["Minh",4,"nam"],["Hà",2,"nu"],["Phong",3,"nam"],["Ngọc",4,"nu"],["Duy",3,"nam"],["Trang",3,"nu"],["Khoa",2,"nam"]].forEach(([n,l,g])=>put("players",uid(),{name:n+" (mẫu)",level:l,g,here:true}));toast("Đã thêm 10 người mẫu");break;
    case "here":if(!canWrite)return;upd("players",id,{here:!S.players[id].here});break;
    case "allhere":players().forEach(p=>{if(!p.here)upd("players",p.id,{here:true})});break;
    case "nohere":players().forEach(p=>{if(p.here)upd("players",p.id,{here:false})});break;
    case "fmt":ui.fmt=t.dataset.v;ui.draft=null;render();break;
    case "pmode":ui.pmode=t.dataset.v;render();break;
    case "pair":pairAll();render();break;
    case "pickone":pairOne(+t.dataset.i);render();break;
    case "rmcourt":ui.draft.courts.splice(+t.dataset.i,1);render();break;
    case "dropmatch":ui.draft.courts[+t.dataset.i]={free:true};render();break;
    case "savematch":{const m=ui.draft.courts[+t.dataset.i];const sa=num(m.sa),sb=num(m.sb);
      if(sa===sb){toast("Nhập tỉ số có bên thắng trước khi lưu");return}
      put("matches",uid(),{date:today(),a:m.a,b:m.b,sa,sb,startAt:m.startAt||null,at:Date.now()});
      const s=sessionOn(today());if(s){const att=[...new Set((s.att||[]).concat(m.a,m.b))];if(att.length!==(s.att||[]).length)upd("sessions",s.id,{att})}
      ui.draft.courts[+t.dataset.i]={free:true};render();toast("Đã lưu, bảng điểm đã cập nhật");break}
    case "step":{const k=t.dataset.k;const r=ui.tab==="tien"&&ui.sessionId?rulesFor(S.sessions[ui.sessionId].date):rulesFor(ui.day||today());setRule(k,Math.max(0,Math.min(20,r[k]+ +t.dataset.d)));break}
    case "newsess":newSession(t.dataset.date||today());break;
    case "receipt":if(!id)return;ui.receipt=id;render();break;
    case "backup":{const data=JSON.stringify({app:"hoi-quan-long-thu",version:1,exportedAt:new Date().toISOString(),players:S.players,matches:S.matches,sessions:S.sessions,cfg:S.cfg},null,1);
      if(plainDownload("hoi-quan-long-thu-"+today()+".json",data,"application/json"))toast("Đã tải bản sao lưu");else toast("Không tải được bản sao lưu");break}
    case "closereceipt":ui.receipt=null;render();break;
    case "bankedit":ui.bankEdit=true;render();break;
    case "bankcancel":ui.bankEdit=false;render();break;
    case "copyval":{const v=t.dataset.v;try{navigator.clipboard.writeText(v).then(()=>toast("Đã chép "+v),()=>toast(v))}catch(err){toast(v)}break}
    case "savereceipt":{const r=receiptData(ui.sessionId,ui.receipt);if(!r)return;const blob=rcCache.blob;
      const fname="phieu-thu-"+ascii(r.name).replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()+"-"+r.s.date+".png";
      if(!IN_CLAUDE){if(plainDownload(fname,blob||dataUrlToBlob(rcCache.url)))toast("Đã tải phiếu thu");else toast("Bấm giữ vào ảnh để lưu");return}
      (async()=>{const dl=dlP?await dlP:null;if(!dl){ui.canDownload=false;render();toast("Bấm giữ vào ảnh để lưu");return}
        try{await dl.save({filename:fname,data:blob||rcCache.url});toast("Đã lưu phiếu thu")}catch(err){if(err&&err.code==="declined")return;if(err&&(err.code==="unavailable"||err.code==="host_unavailable"||err.code==="not_granted")){ui.canDownload=false;render()}toast("Không tải được, bấm giữ vào ảnh để lưu")}})();break}
    case "ask":ui.confirm=t.dataset.c;render();break;
    case "cancelc":ui.confirm=null;render();break;
    case "delmatch":ui.confirm=null;del("matches",id);break;
    case "delp":ui.confirm=null;del("players",id);break;
    case "delsess":ui.confirm=null;del("sessions",id);ui.sessionId=null;break;
    case "copy":{const s=S.sessions[ui.sessionId];if(!s)return;const txt=summaryText(s);const box=$("#copybox"),ta=$("#copytext");ta.value=txt;box.hidden=false;
      const fallback=()=>{ta.focus();ta.select();toast("Đã chọn sẵn nội dung, bấm giữ để sao chép")};
      try{navigator.clipboard.writeText(txt).then(()=>toast("Đã sao chép, dán vào Zalo/Messenger"),fallback)}catch(err){fallback()}break}
  }
});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ui.tab=b.dataset.tab;ui.confirm=null;try{localStorage.setItem(LS+".tab",ui.tab)}catch(err){}render();window.scrollTo(0,0)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.receipt){ui.receipt=null;render();return}if((e.key==="Enter"||e.key===" ")&&e.target.matches(".chip[role=button]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.s&&ui.draft)ui.draft.courts[+t.dataset.i][t.dataset.s]=t.value});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.act,id=t.dataset.id;
  if(t.id==="courts"){putCfg({courts:Math.max(1,Math.min(10,num(t.value)||1))});return}
  if(t.id==="priority"){putCfg({priority:t.value});return}
  if(t.id==="genderBalance"){putCfg({genderBalance:t.checked});ui.draft=null;return}
  if(a==="gender"){upd("players",id,{g:t.value});return}
  if(t.id==="winPts"||t.id==="losePts"){putCfg({[t.id]:Math.max(0,num(t.value))});return}
  if(t.id==="day"){ui.day=t.value;render();return}
  if(t.id==="restorefile"&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(o.app!=="hoi-quan-long-thu"||!o.players)throw 0;
      COLS.forEach(c=>S[c]=o[c]||{});S.cfg=o.cfg||null;saveLocal();render();toast("Đã khôi phục "+Object.keys(S.players).length+" thành viên, "+Object.keys(S.matches).length+" trận")}catch(err){toast("File không đúng định dạng sao lưu")}};fr.readAsText(t.files[0]);return}
  if(t.id==="bk_bin"){const w=$("#bk_custom_wrap");if(w)w.hidden=t.value!=="custom";return}
  if(t.id==="pick"){ui.sessionId=t.value;render();return}
  if(t.dataset.sf&&ui.sessionId){const f=t.dataset.sf;const v=f==="date"?t.value:Math.max(0,num(t.value));if(f==="courtFee"||f==="shuttlePrice")putCfg({[f]:v});upd("sessions",ui.sessionId,{[f]:v});return}
  if(a==="exempt"){const r=rulesFor(S.sessions[ui.sessionId].date);setRule("exempt",Object.assign({},r.exempt,{[t.dataset.k]:t.checked}));return}
  if(a==="here"){upd("players",id,{here:t.checked});return}
  if(a==="level"){upd("players",id,{level:+t.value});return}
  if(a==="att"){const s=S.sessions[ui.sessionId];const att=t.checked?(s.att||[]).concat(id):(s.att||[]).filter(x=>x!==id);upd("sessions",ui.sessionId,{att});return}
  if(a==="spaid"){const s=S.sessions[ui.sessionId];upd("sessions",ui.sessionId,{paid:Object.assign({},s.paid||{},{[id]:t.checked})});return}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
  if(f.id==="bankform"){let bin=$("#bk_bin").value;if(bin==="custom")bin=$("#bk_custom").value.replace(/\D/g,"");const acct=$("#bk_acct").value.replace(/[^0-9A-Za-z]/g,"");const holder=ascii($("#bk_holder").value).toUpperCase().trim().slice(0,40);
    if(!/^\d{6}$/.test(bin)){toast("Mã BIN ngân hàng gồm 6 số");return}if(acct.length<4){toast("Nhập số tài khoản");return}
    ui.bankEdit=false;putCfg({bank:{bin,acct,holder}});toast("Đã lưu tài khoản nhận tiền");return}
  if(f.id==="addp"){const n=$("#pn").value.trim();if(!n){toast("Nhập tên người chơi");return}put("players",uid(),{name:n.slice(0,40),level:+$("#pl").value,g:$("#pg").value,here:true});toast("Đã thêm "+n);setTimeout(()=>{const el=$("#pn");if(el)el.focus()},0)}
});

render();
initStore();
try{dlP=window.claude&&window.claude.use?window.claude.use("downloads"):null}catch(e){dlP=null}
})();
</script>
